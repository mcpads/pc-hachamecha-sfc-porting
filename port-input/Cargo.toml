[package]
name = "hachamecha-input"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { "version" = "1", "features" = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { "version" = "=8.6.0", "default-features" = false, "features" = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
